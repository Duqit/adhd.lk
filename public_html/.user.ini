; PHP settings for adhd.lk (honoured by PHP-FPM / LiteSpeed / CGI).
; Session cookie hardening — applies to every page without code changes.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1

; Never print PHP errors to visitors; log them instead.
display_errors = 0
log_errors = 1
